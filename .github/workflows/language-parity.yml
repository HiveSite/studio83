name: Verify SR-EN parity
on:
  push:
    branches:
      - fix/sr-en-parity-2026-11-12
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bilingual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare DOM audit Python environment
        run: |
          python3 -m venv /tmp/sindikat-audit
          /tmp/sindikat-audit/bin/python -m pip install --disable-pip-version-check beautifulsoup4==4.14.2
      - name: Build every SR/EN page and validate parity
        run: npm run build
      - name: Verify generated SR and EN entry content
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          for(const route of ["","usluge/"]){
            for(const lang of ["","en/"]){
              const html=fs.readFileSync("dist/"+lang+route+"index.html","utf8");
              const start=html.indexOf("<h1");
              const end=html.indexOf("</h1>",start)+5;
              console.log(lang+route+": "+html.slice(start,end).slice(0,260));
            }
          }
          '
      - name: Validate all generated routes and internal links
        run: npm run test
      - name: Audit bilingual DOM and structured data
        run: |
          PATH="/tmp/sindikat-audit/bin:$PATH" npm run audit
      - name: Export content inventory
        run: npm run i18n:inventory
      - name: Install Chromium for page-by-page visual smoke tests
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check all SR/EN pages in three viewport widths
        run: node tests/browser-smoke.mjs
      - name: Save representative screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio83-browser-qa
          path: |
            reports/browser-qa.json
            reports/screenshots/
          if-no-files-found: ignore
          retention-days: 7
